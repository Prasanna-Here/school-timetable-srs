
spring.datasource.url=jdbc:mysql://localhost:3306/timetable?allowPublicKeyRetrieval=true&useSSL=false

spring.datasource.username=root
spring.datasource.password=1234

# JDBC driver (Spring Boot usually detects this automatically)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# =  JPA / Hibernate Config     =
# ===============================

# Automatically create/update the schema (for dev purposes)
spring.jpa.hibernate.ddl-auto=update

# Show SQL statements in the console (optional)
spring.jpa.show-sql=true

# Format SQL nicely (optional)
spring.jpa.properties.hibernate.format_sql=true

# Dialect (optional but good to specify)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

server.port=8080

# secret key used to sign tokens (must be long enough, 32+ chars)
jwt.secret=my_super_long_random_secret_key_1234567890_abcdef

# how long the token is valid (in milliseconds)
# 36000000 ms = 10 hours
jwt.expirationMs=36000000
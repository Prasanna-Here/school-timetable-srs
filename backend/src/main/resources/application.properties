
# Database configuration - using environment variables for production
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/timetable?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

# JDBC driver (Spring Boot usually detects this automatically)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# =  JPA / Hibernate Config     =
# ===============================

# Automatically create/update the schema (for dev purposes)
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}

# Show SQL statements in the console (optional)
spring.jpa.show-sql=${SHOW_SQL:true}

# Format SQL nicely (optional)
spring.jpa.properties.hibernate.format_sql=true

# Dialect (optional but good to specify)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Server configuration
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:my_super_long_random_secret_key_1234567890_abcdef}
jwt.expirationMs=${JWT_EXPIRATION:36000000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.netlify.app}